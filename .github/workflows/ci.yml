name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the production build succeeds in CI; real values are
      # injected by Vercel at deploy time.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      # Pinned to the version the maintainer's machine runs, so a green
      # `npm run ci` locally means a green pipeline. Vite 8 needs >= 20.19.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      # The Edge Functions are Deno, and outside tsconfig/eslint entirely.
      # Without this they ship unchecked and fail at runtime instead.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:functions
      - run: npm run test:functions
      - run: npm run build
